# Every push and pull request: the addon (the writing builds and both data files
# are up to date with it, its simulation on both games, the writer's test with
# hundreds of books, the sample, both packages) and the site (typecheck, lint,
# tests, build).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get install -y -qq luajit
      - name: Writing builds, data files are up to date
        run: bun scripts/build.ts --check
      - name: Simulation
        run: luajit addon/test/sim.lua
      - name: Simulation (Forever)
        run: FOREVER=1 luajit addon/test/sim.lua
      - name: Writer
        run: luajit addon/test/writer.lua
      - name: Sample
        run: luajit addon/test/sample.lua > /dev/null
      - name: Packages
        run: bun scripts/package.ts
      - run: bun install --frozen-lockfile
      - name: Site typecheck
        run: bun run typecheck
      - name: Site lint
        run: bun run lint
      - name: Site tests
        run: bun run test
      - name: Site build
        run: bun run build
