# Every push and pull request: the content builds and both content files are
# up to date with it, the addon passes its simulation on both games, and both
# packages assemble.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get install -y -qq luajit
      - name: Content builds, content files are up to date
        run: bun scripts/build.ts --check
      - name: Simulation
        run: luajit addon/test/sim.lua
      - name: Simulation (Forever)
        run: FOREVER=1 luajit addon/test/sim.lua
      - name: Packages
        run: bun scripts/package.ts
