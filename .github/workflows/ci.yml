# Every push and pull request: the addon (its Lua formatted and linted, the
# writing builds and both data files are up to date with it, its simulation on both games, the writer's test with
# hundreds of books, the sample, the package and the release's, made by the BigWigs
# packager as release.yml makes it) and the site (typecheck, lint, tests, build).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # (first: the writing's build reads the English word list from node_modules)
      - run: bun install --frozen-lockfile
      - run: sudo apt-get install -y -qq luajit
      - name: Lua tools (StyLua, selene)
        run: |
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -sSLo stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          curl -sSLo selene.zip https://github.com/Kampfkarren/selene/releases/download/0.32.0/selene-0.32.0-linux.zip
          unzip -qo stylua.zip && unzip -qo selene.zip && chmod +x stylua selene
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Addon Lua formatted and linted
        run: stylua --check addon && selene addon/Hearthtale
      - name: Writing builds, data files are up to date
        run: bun scripts/build.ts --check
      - name: Simulation
        run: luajit addon/test/sim.lua
      - name: Simulation (Forever)
        run: FOREVER=1 luajit addon/test/sim.lua
      - name: Writer
        run: luajit addon/test/writer.lua
      - name: Writer (Forever)
        run: FOREVER=1 luajit addon/test/writer.lua
      - name: Samples (the landing page's, as the writer writes them)
        run: luajit addon/test/sample.lua > /dev/null && luajit addon/test/sample.lua landing --check
      - name: Package (its TOCs agree)
        run: bun scripts/package.ts
      # The release's package (release.yml), made without publishing: the
      # addon's folder, nothing more or less.
      - run: echo "(CI)" > .release-notes.md
      - uses: BigWigsMods/packager@v2.6.1
        with:
          args: -d -u
          pandoc: false
      - run: diff -r addon/Hearthtale .release/Hearthtale
      - name: Site typecheck
        run: bun run typecheck
      - name: Site lint
        run: bun run lint
      - name: Site tests
        run: bun run test
      - name: Site build
        run: bun run build
