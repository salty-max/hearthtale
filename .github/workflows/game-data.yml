# Every day, and by hand: Hearthtale's game data built again from wow-data's
# pins (salty-max/wow-data's addon-data.yml: wow-data beside it, the databases
# downloaded; its own daily job moves the pins when the game's builds move).
# When a generated file changes, a pull request: the journals compared before
# and after (scripts/golden.sh) and the addon's checks. Never merged by
# itself. A day without change ends after the build.
name: Game data

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  data:
    uses: salty-max/wow-data/.github/workflows/addon-data.yml@main
    with:
      # (the last run's audit kept: the journals before)
      cache: addon/.cache/audit
      before: |
        rm -rf "$RUNNER_TEMP/audit-before"
        if [ -d .cache/audit ]; then cp -r .cache/audit "$RUNNER_TEMP/audit-before"; fi
      generate: bun run audit
      # (before: the committed files and the last run's audit; after: this run's)
      report: |
        mv .cache/audit "$RUNNER_TEMP/audit-after"
        if [ -d "$RUNNER_TEMP/audit-before" ]; then mv "$RUNNER_TEMP/audit-before" .cache/audit; else mkdir -p .cache/audit; fi
        git stash push -q -- addon/Hearthtale
        bash scripts/golden.sh save > /dev/null
        git stash pop -q
        rm -rf .cache/audit && mv "$RUNNER_TEMP/audit-after" .cache/audit
        echo "### The journals, before and after (scripts/golden.sh)"
        echo
        echo '```'
        bash scripts/golden.sh check || head -c 60000 .cache/golden/diff.txt
        echo '```'
      check: bun run addon:check
      paths: addon/Hearthtale
